<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MASAGI — News &amp; Insights{% endblock %}</title>
<meta name="description" content="{% block description %}News, insights, use cases and field notes from MASAGI Digital — operational software for growing companies in Indonesia.{% endblock %}">
<link rel="canonical" href="{% block canonical %}{{ blog_base }}/{% endblock %}">
<meta property="og:site_name" content="MASAGI Digital">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta property="og:title" content="{% block ogtitle %}MASAGI — News &amp; Insights{% endblock %}">
<meta property="og:description" content="{% block ogdesc %}News, insights, use cases and field notes from MASAGI Digital.{% endblock %}">
{% block oghead %}{% endblock %}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='16' fill='%239333ea'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='11' stroke-linejoin='miter'%3E%3Cpath d='M49,26 L83,60 L49,94 L15,60 Z'/%3E%3Cpath d='M71,26 L105,60 L71,94 L37,60 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css?v=2">
<link rel="stylesheet" href="/static/ddam.css?v=1">
<style>
/* Tokens come from /static/tokens.css (same file as the landing). */
h1,h2,h3,h4 { font-weight:600; letter-spacing:-.022em; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text);
  line-height:1.65; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }
.wrap { max-width:1120px; margin:0 auto; padding:0 22px; }

/* header */
header.top { position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border:0; }
.top-in { max-width:1120px; margin:0 auto; padding:0 22px; height:64px; display:flex;
  align-items:center; justify-content:space-between; gap:14px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; }
.brand svg { height:24px; }
.brand .sub { font-size:10px; letter-spacing:.26em; color:var(--text-2); font-weight:700; }
.cats { display:flex; gap:4px; flex-wrap:wrap; }
.cats a { font-size:13px; font-weight:500; color:var(--text-2); padding:7px 13px; border-radius:var(--pill); }
.cats a:hover { color:var(--text); background:var(--surface-2); }
.cats a.on { background:var(--accent); color:var(--accent-ink); font-weight:600; }
.tools { display:flex; align-items:center; gap:8px; }
.icon-btn { font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:6px 12px;
  border:0; border-radius:var(--pill); background:transparent; color:var(--text-2); }
.icon-btn:hover { color:var(--text); border-color:var(--accent-line); }
.lang-btn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
/* Never hide the only navigation the blog has — below 860px the categories
   become a horizontally scrollable strip instead of disappearing. */
@media (max-width:860px){
  .top-in { flex-wrap:wrap; height:auto; padding-top:10px; padding-bottom:10px; gap:10px; }
  .cats { order:3; width:100%; flex-wrap:nowrap; overflow-x:auto; gap:6px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .cats::-webkit-scrollbar { display:none; }
  .cats a { white-space:nowrap; flex:0 0 auto; }
}

/* footer */
footer.foot { border:0; margin-top:70px; background:var(--bg-2); }
.foot-in { max-width:1120px; margin:0 auto; padding:30px 22px; display:flex; justify-content:space-between;
  gap:16px; flex-wrap:wrap; color:var(--text-2); font-size:13px; }
.foot-in a { color:var(--accent); font-weight:600; }

/* shared bits */
.eyebrow { font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.tag { display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft); border:0;
  padding:4px 10px; border-radius:var(--pill); }
::selection { background:var(--accent); color:var(--accent-ink); }
.muted { color:var(--text-2); }
</style>
{% block head %}{% endblock %}
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="https://masagi.io">
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M49,20 L89,60 L49,100 L9,60 Z"/><path d="M71,20 L111,60 L71,100 L31,60 Z"/></svg>
      <span>MASAGI<br><span class="sub">MEDIA</span></span>
    </a>
    <nav class="cats">
      <a href="/" class="{{ 'on' if active is not defined or active is none else '' }}"
         data-en="All" data-id="Semua">All</a>
      {% for key, label_en, label_id in types %}
        <a href="/category/{{ type_slug[key] }}" class="{{ 'on' if active is defined and active == key else '' }}"
           data-en="{{ label_en }}" data-id="{{ label_id }}">{{ label_en }}</a>
      {% endfor %}
    </nav>
    <div class="tools">
      <button class="icon-btn lang-btn on" data-lang="en" type="button">EN</button>
      <button class="icon-btn lang-btn" data-lang="id" type="button">ID</button>
    </div>
  </div>
</header>

{% block content %}{% endblock %}

<footer class="foot">
  <div class="foot-in">
    <span>© <span id="yr"></span> MASAGI Digital · Jakarta, Indonesia</span>
    <span><a href="https://masagi.io">masagi.io</a> · <a href="https://masagi.io/#contact"
      data-en="Contact us" data-id="Hubungi kami">Contact us</a></span>
  </div>
</footer>

<script>
document.getElementById("yr").textContent = new Date().getFullYear();

/* language — swaps [data-en]/[data-id] text and .lang-block visibility */
function applyLang(lang){
  if (lang !== "id") lang = "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-en]").forEach(function(el){
    var v = el.getAttribute("data-" + lang);
    if (v) el.textContent = v;
  });
  document.querySelectorAll(".lang-block").forEach(function(el){
    el.hidden = el.getAttribute("data-lang") !== lang;
  });
  document.querySelectorAll(".lang-btn").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-lang") === lang);
  });
  try { localStorage.setItem("masagi-lang", lang); } catch(e) {}
}
document.querySelectorAll(".lang-btn").forEach(function(b){
  b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
});
var savedLang = null; try { savedLang = localStorage.getItem("masagi-lang"); } catch(e) {}
applyLang(savedLang || ((navigator.language || "").toLowerCase().indexOf("id") === 0 ? "id" : "en"));
</script>
</body>
</html>
