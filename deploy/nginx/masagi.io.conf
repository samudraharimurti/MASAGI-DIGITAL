# MASAGI Digital — masagi.io
# Static landing page (landing/) is the public homepage; the Flask/gunicorn
# app remains the backend for blog articles, the site-content CMS API,
# sitemap/robots, and its own /static assets. /app, /access, /store, /admin,
# /login, /databases, /product remain unexposed until ready to go live —
# widen this allowlist (or just proxy_pass everything) when that time comes.

upstream masagi_app {
    server 127.0.0.1:8010;
}

server {
    server_name masagi.io;
    root /var/www/masagi-digital/landing;

    # --- audit: transport + content security -------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- audit: HTML/CSS/JS were served uncompressed ------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/rss+xml application/atom+xml;

    # marketing homepage — static landing page
    location = / {
        try_files /index.html =404;
    }

    # the landing page's own CSS/JS (root-relative, not under /static/)
    location ~ ^/(styles\.css|tokens\.css|ddam\.css|theme-swiper\.css|script\.js|translations\.js)$ {
        try_files $uri =404;
    }

    # insight/news articles (Flask-backed)
    location ~ ^/blog/(.*)$ { return 301 https://blog.masagi.io/$1; }

    # CMS content feed the landing page's Media links point into (GET only;
    # the API itself still enforces admin auth for writes server-side)
    location = /api/site-content {
        limit_except GET { deny all; }
        proxy_pass http://masagi_app;
        include /etc/nginx/proxy_params.conf;
    }

    location = /sitemap.xml { proxy_pass http://masagi_app; include /etc/nginx/proxy_params.conf; }
    location = /robots.txt  { proxy_pass http://masagi_app; include /etc/nginx/proxy_params.conf; }

    # static assets used by the Flask app's own pages (blog, etc.)
    location /static/ {
        proxy_pass http://masagi_app;
        include /etc/nginx/proxy_params.conf;
        expires 7d;
        add_header Cache-Control 'public';
    }

    # everything else (ERP console, access portal, store, admin, login) stays
    # off the public site for now
    location = /pricing { try_files /pricing.html =404; }
    location = /pricing.html { try_files /pricing.html =404; }
    location ^~ /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }

    # temporary design preview (restyled landing) — remove once promoted
    location /preview/ {
        root /var/www/masagi-digital/preview-root;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/masagi.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/masagi.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name masagi.io www.masagi.io;
    return 301 https://masagi.io$request_uri;
}

# --- audit P0-1: www was a cert mismatch on 443 and a hard 404 on 80. -------
# One canonical host (the apex); www 301s to it on both schemes.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.masagi.io;
    ssl_certificate /etc/letsencrypt/live/masagi.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masagi.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://masagi.io$request_uri;
}
