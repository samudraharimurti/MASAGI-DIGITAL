<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="MASAGI">
  <!-- DUO mark. Squarer than the mark it replaces, so the wordmark moves left
       and the viewBox narrows from 620 to keep the lockup tight. -->
  <g transform="translate(0,-10) scale(1.2)" fill="none" stroke="#FFFFFF"
     stroke-width="7" stroke-linejoin="miter">
    <path d="M49,20 L89,60 L49,100 L9,60 Z"/>
    <path d="M71,20 L111,60 L71,100 L31,60 Z"/>
  </g>
  <!-- Poppins first to match the sites; an SVG loaded via <img> cannot pull a
       webfont, so the heavy system stack stays as the fallback. -->
  <text x="160" y="108" font-family="Poppins,'Arial Black','Segoe UI Black',Arial,sans-serif"
        font-weight="900" font-size="84" letter-spacing="1" fill="#FFFFFF">MASAGI</text>
</svg>
